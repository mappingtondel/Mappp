<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>GameMap</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:rgba(20,24,28,.88);--fg:#e8edf2;--acc:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b2025;color:var(--fg);font:16px -apple-system,system-ui,sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
.panel{background:var(--bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
#side{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 12px);display:flex;flex-direction:column;gap:10px;z-index:2}
.fab{width:46px;height:46px;border-radius:50%;border:0;font-size:20px;color:var(--fg)}
#sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);padding:10px 14px;z-index:2}
#q{width:100%;border:0;background:transparent;color:var(--fg);font-size:17px;padding:8px 0;outline:none}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #ffffff22;color:var(--fg);padding:9px 0}
.row small{display:block;opacity:.6}
#card{display:none;padding-top:6px}
#card h3{margin:4px 0 2px}#card p{margin:0 0 10px;opacity:.65}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;margin-right:8px;background:#ffffff22;color:var(--fg)}
.btn.p{background:var(--acc);color:#14181c;font-weight:700}
#cBtns{display:flex;flex-wrap:wrap;gap:8px}#cBtns .btn{margin:0;padding:12px 15px;font-size:15px}
#banner,#navbar{display:none;position:absolute;left:10px;right:10px;z-index:2;padding:12px 16px}
#banner{top:calc(env(safe-area-inset-top) + 8px);right:70px}
#banner .big{font-size:28px;font-weight:700;color:var(--acc)}
#navbar{bottom:calc(env(safe-area-inset-bottom) + 10px);display:none;align-items:center;justify-content:space-between}
body.nav #banner{display:block}body.nav #navbar{display:flex}body.nav #sheet{display:none}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:var(--bg);padding:8px 14px;border-radius:14px;z-index:3;opacity:0;transition:opacity .3s;pointer-events:none}
.me{width:30px;height:30px}
.me svg{width:30px;height:30px;filter:drop-shadow(0 0 4px #000)}
</style></head><body>
<div id="map"></div>
<div id="side"><button class="fab panel" id="styleBtn">🎨</button><button class="fab panel" id="locBtn">⌖</button><button class="fab panel" id="voiceBtn">🔊</button></div>
<div id="banner" class="panel"><div class="big" id="bDist"></div><div id="bText"></div></div>
<div id="navbar" class="panel"><div><b id="eta"></b><div id="rem" style="opacity:.65"></div></div><button class="btn p" id="stopBtn">Beenden</button></div>
<div id="sheet" class="panel">
  <div id="card"><h3 id="cTitle"></h3><p id="cSub"></p><div id="cBtns"></div></div>
  <div id="results"></div>
  <input id="q" placeholder="🔍  Suche nach Orten" autocomplete="off">
</div>
<div id="toast"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id);
/* Kartenstile + Icons direkt im Code (Vorlage: GTA-V-Pausenkarte, RDR2-Karte) */
const STYLES=[["Radar","radar","#a34cf1","#1b0f26"],["Pergament","parch","#c0281f","#3d1b12"]];
const PAL={
 radar:{bg:"#181818",park:"#202020",water:"#2b2e2f",wline:"#2b2e2f",bld:null,minor:"#505050",main:"#8b8b8b",major:"#9fa1a2",casing:"#181818",rw:1.25,label:"#d6d6d6",halo:"#181818",upper:0},
 parch:{bg:"#c9b490",park:"#bfae8b",water:"#98917f",wline:"#827964",bld:"#7a6d59",bldo:"#454037",minor:"#5c554a",main:"#4f493f",major:"#454037",casing:"#cdb995",rw:1,label:"#4a443d",halo:"#ccb691",upper:1}};
const POI={food:["restaurant","fast_food","food_court","ice_cream","biergarten","bakery"],cafe:["cafe"],bar:["bar","pub","nightclub"],
 sport:["fitness_centre","sports_centre","gym","stadium","swimming_pool","swimming","pitch"],townhall:["townhall","town_hall","courthouse"],
 health:["hospital","clinic","doctors","pharmacy","dentist"],edu:["school","kindergarten","college","university","library"],
 shop:["supermarket","grocery","convenience","department_store","mall","clothing_store"],fuel:["fuel","charging_station"],
 hotel:["hotel","hostel","motel","guest_house","lodging"],parking:["parking"],bank:["bank","atm"],post:["post_office","post"],
 police:["police"],fire:["fire_station"],culture:["museum","cinema","theatre","castle","zoo","attraction"]};
const zw=x=>["interpolate",["exponential",1.5],["zoom"],8,x*0.1,14,x,20,x*14];
const cls=(...n)=>["match",["get","class"],n,true,false];
const inKeys=keys=>["any",["match",["to-string",["get","class"]],keys,true,false],["match",["to-string",["get","subclass"]],keys,true,false]];
function buildStyle(k){
  const p=PAL[k],S="openmaptiles",F=["Noto Sans Regular"],L=[{id:"bg",type:"background",paint:{"background-color":p.bg}}];
  L.push({id:"land",type:"fill",source:S,"source-layer":"landcover",filter:cls("grass","wood","farmland"),paint:{"fill-color":p.park,"fill-opacity":0.7}});
  L.push({id:"park",type:"fill",source:S,"source-layer":"park",paint:{"fill-color":p.park}});
  L.push({id:"water",type:"fill",source:S,"source-layer":"water",paint:{"fill-color":p.water,"fill-outline-color":p.wline}});
  L.push({id:"waterway",type:"line",source:S,"source-layer":"waterway",paint:{"line-color":p.wline,"line-width":zw(1.5)}});
  if(p.bld)L.push({id:"building",type:"fill",source:S,"source-layer":"building",minzoom:14,paint:{"fill-color":p.bld,"fill-outline-color":p.bldo}});
  [["minor",["minor","service"],p.minor,3,13],["main",["tertiary","secondary","primary"],p.main,5,9],["major",["motorway","trunk"],p.major,7,5]].forEach(([id,names,col,wd,mz])=>{
    wd*=p.rw;
    const b={type:"line",source:S,"source-layer":"transportation",filter:cls(...names),minzoom:mz,layout:{"line-cap":"round","line-join":"round"}};
    L.push({...b,id:id+"_casing",paint:{"line-color":p.casing,"line-width":zw(wd+2)}});
    L.push({...b,id:id+"_fill",paint:{"line-color":col,"line-width":zw(wd)}});
  });
  const nm=["to-string",["coalesce",["get","name_de"],["get","name"]]];
  const tp={"text-color":p.label,"text-halo-color":p.halo,"text-halo-width":1.5};
  const up=p.upper?{"text-transform":"uppercase","text-letter-spacing":0.2}:{},sc=p.upper?1.25:1;
  L.push({id:"road_labels",type:"symbol",source:S,"source-layer":"transportation_name",minzoom:14,layout:{"text-font":F,"text-max-width":8,"symbol-placement":"line","text-field":nm,"text-size":11,...up},paint:tp});
  L.push({id:"places",type:"symbol",source:S,"source-layer":"place",filter:cls("city","town","village","suburb"),layout:{"text-font":F,"text-max-width":9,"text-field":nm,"text-size":["match",["get","class"],"city",16*sc,"town",14*sc,12*sc],...up},paint:tp});
  Object.keys(POI).forEach(g=>L.push({id:"poi_"+g,type:"symbol",source:S,"source-layer":"poi",minzoom:15,filter:inKeys(POI[g]),
    layout:{"icon-image":"ic-"+g+"-"+k,"icon-size":["interpolate",["linear"],["zoom"],15,0.6,18,1],"icon-padding":6,
      "text-field":nm,"text-font":F,"text-size":10,"text-anchor":"top","text-offset":[0,1.4],"text-optional":true,"text-max-width":7},paint:tp}));
  return {version:8,sources:{[S]:{type:"vector",url:"https://tiles.openfreemap.org/planet",attribution:"© OpenStreetMap contributors, © OpenFreeMap"}},
    glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",layers:L};
}
const styleOf=i=>buildStyle(STYLES[i][1]);

/* Icons nach den Vorlagen: Radar = GTA-V-Blips (weiße Silhouette, schwarzer Rand, ohne Kreis), Pergament = RDR2 (dunkle Scheibe, helles Symbol) */
const star=(cx,cy,ro,ri)=>{let d="";for(let i=0;i<10;i++){const r=i%2?ri:ro,a=-Math.PI/2+i*Math.PI/5;d+=(i?"L":"M")+(cx+r*Math.cos(a)).toFixed(2)+" "+(cy+r*Math.sin(a)).toFixed(2)}return d+"Z"};
const INK="#14181c";
/* Glyphen: [Silhouette, Detail] bzw. Buchstabe. 32x32-Raster. Radar: weiß + schwarzer Rand, Details schwarz. Pergament: Scheibe, Details in Scheibenfarbe */
const G={
 food:["M8 5h1.6v7h1.2V5h1.6v7h1.2V5h1.6v8c0 1.7-1.2 3-2.8 3.3V27h-1.8V16.3C9.2 16 8 14.7 8 13z M24 5c-3 0-5 3.5-5 8.5 0 1.3.5 2.2 1.4 2.5H22V27h2z"],
 cafe:["M6 11h14v7a7 7 0 0 1-14 0z M20 13h1.8a3.7 3.7 0 0 1 0 7.4H19.5v-2h2.3a1.7 1.7 0 0 0 0-3.4H20z M8.2 4.5h1.7v4.7H8.2z M12.2 4.5h1.7v4.7h-1.7z M16.2 4.5h1.7v4.7h-1.7z"],
 bar:["M5.5 6h21L17 17.2V25h4.5v2h-11v-2H15v-7.2z"],
 sport:["M3.5 12h3v8h-3z M6.5 9.5h3.2v13H6.5z M9.7 14.8h12.6v2.4H9.7z M22.3 9.5h3.2v13h-3.2z M25.5 12h3v8h-3z"],
 townhall:["M16 4.5 28 11v2.5H4V11z M6.5 15.5h3v8h-3z M11.8 15.5h3v8h-3z M17.2 15.5h3v8h-3z M22.5 15.5h3v8h-3z M4 25.5h24V28H4z","M16 7.6a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2z"],
 health:["M12 5h8v7h7v8h-7v7h-8v-7H5v-8h7z"],
 edu:["M16 6 29 12.5 16 19 3 12.5z M8 16.5v5c0 2 3.6 4 8 4s8-2 8-4v-5l-8 4z M27 14.2h1.8v8H27z"],
 shop:["M4 12h24l-2.5 13a2 2 0 0 1-2 1.6H8.5a2 2 0 0 1-2-1.6z M10 12 14 5.5h1.9L12.6 12z M22 12 18 5.5h-1.9l3.3 6.5z","M10.5 15.5h1.8v7h-1.8z M15.1 15.5h1.8v7h-1.8z M19.7 15.5h1.8v7h-1.8z"],
 fuel:["M4 5h13.5v22H4z M17.5 11l3.2 3.2v6.2a1.5 1.5 0 0 0 3 0V12.8l-2.5-2.5 1.5-1.5 4.8 4.8v7a4.2 4.2 0 0 1-8.4 0V15z","M7.5 8h6.5v6H7.5z"],
 hotel:["M3.5 7h2.8v18H3.5z M6.3 18.5h22.2V25h-2.8v-3.5H6.3z M12.3 12.5a2.8 2.8 0 1 1-5.6 0 2.8 2.8 0 0 1 5.6 0z M15 11h8a5.5 5.5 0 0 1 5.5 5.5v1.4H15z"],
 parking:"P",bank:"$",
 post:["M4 8h24v16H4z","M4.8 9.3l11.2 8.7 11.2-8.7v2.5L16 20.4 4.8 11.8z"],
 police:["M16 3.5 26 7v8c0 6-4 10.4-10 13C10 25.4 6 21 6 15V7z",star(16,15,5.8,2.4)],
 fire:["M16.5 3C17 8.5 24 12 24 19a8 8 0 0 1-16 0c0-3.4 1.6-5.7 3.4-7.4.3 2.3 1.4 3.7 2.8 4.1C13.2 11.8 14.3 6.6 16.5 3z","M16 15.5c.4 2.4 3 3.6 3 6.2a3 3 0 0 1-6 0c0-1.6.9-2.4 1.7-3.2.2 1 .8 1.5 1.3 1.6z"],
 culture:[star(16,16.5,12.5,5.4)]
};
/* Pergament-Variante (RDR2): Arzttasche statt Kreuz */
const GR={health:["M11 10V8.5A2.5 2.5 0 0 1 13.5 6h5A2.5 2.5 0 0 1 21 8.5V10h4.5a2.5 2.5 0 0 1 2.5 2.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 23.5v-11A2.5 2.5 0 0 1 6.5 10z","M14.6 13.4h2.8v3.2h3.2v2.8h-3.2v3.2h-2.8v-3.2h-3.2v-2.8h3.2z M13.4 10V8.9h5.2V10z"]};
function drawIcon(g,k,mk){
  const c=mk?mk():document.createElement("canvas");c.width=c.height=64;
  const x=c.getContext("2d");x.scale(2,2);x.lineJoin=x.lineCap="round";
  const rdr=k==="parch",gl=(rdr&&GR[g])||G[g],txt=typeof gl==="string";
  const T=()=>{x.font="bold 25px -apple-system,Helvetica,Arial,sans-serif";x.textAlign="center";x.textBaseline="middle"};
  if(!rdr){ /* GTA-Blip: weiße Silhouette, dicker schwarzer Rand, keine Scheibe */
    if(txt){T();x.lineWidth=4.5;x.strokeStyle=INK;x.strokeText(gl,16,17);x.fillStyle="#fff";x.fillText(gl,16,17)}
    else{const s=new Path2D(gl[0]);x.lineWidth=3.4;x.strokeStyle=INK;x.stroke(s);x.fillStyle="#fff";x.fill(s);if(gl[1]){x.fillStyle=INK;x.fill(new Path2D(gl[1]))}}
  }else{ /* RDR2: dunkle Scheibe, Pergament-Symbol */
    const bg="#2f2d29",fg="#eadcb8";
    x.beginPath();x.arc(16,16,14,0,7);x.fillStyle=bg;x.fill();x.lineWidth=1.8;x.strokeStyle=fg;x.stroke();
    x.save();x.translate(16,16.5);x.scale(.7,.7);x.translate(-16,-16);
    if(txt){T();x.fillStyle=fg;x.fillText(gl,16,17)}
    else{x.fillStyle=fg;x.fill(new Path2D(gl[0]));if(gl[1]){x.fillStyle=bg;x.fill(new Path2D(gl[1]))}}
    x.restore();
  }
  return c;
}
const VALHALLA="https://valhalla1.openstreetmap.de/route";
let si=0,me=null,hdg=0,first=true,follow=true,nav=false,dest=null,destMarker=null;
let shape=[],cum=[],man=[],tripTime=0,routeGeo=null,lastIdx=0,spoke={},lastReroute=0,wakeLock=null;

const map=new maplibregl.Map({container:"map",style:styleOf(0),center:[10.4,51.1],zoom:5,maxPitch:70,attributionControl:false});
map.addControl(new maplibregl.AttributionControl({compact:true}),"top-left");
map.on("style.load",addRoute);
map.on("styleimagemissing",e=>{
  const [,g,k]=e.id.split("-");
  if(POI[g]&&PAL[k]){const c=drawIcon(g,k);map.addImage(e.id,c.getContext("2d").getImageData(0,0,64,64),{pixelRatio:2})}
});
let lastErr=0;map.on("error",e=>{if(Date.now()-lastErr>6000){lastErr=Date.now();toast("Kartenfehler: "+((e.error&&e.error.message)||"unbekannt"))}});
map.on("dragstart",()=>{follow=false});
const KIND={restaurant:"Restaurant",fast_food:"Imbiss",food_court:"Food Court",ice_cream:"Eisdiele",biergarten:"Biergarten",bakery:"Bäckerei",cafe:"Café",bar:"Bar",pub:"Kneipe",nightclub:"Nachtclub",
  fitness_centre:"Fitnessstudio",sports_centre:"Sportzentrum",gym:"Fitnessstudio",stadium:"Stadion",swimming_pool:"Schwimmbad",townhall:"Rathaus",courthouse:"Gericht",hospital:"Krankenhaus",
  clinic:"Klinik",doctors:"Arzt",pharmacy:"Apotheke",dentist:"Zahnarzt",school:"Schule",kindergarten:"Kindergarten",college:"Hochschule",university:"Universität",library:"Bibliothek",
  supermarket:"Supermarkt",grocery:"Lebensmittel",convenience:"Kiosk",department_store:"Kaufhaus",mall:"Einkaufszentrum",clothing_store:"Modegeschäft",fuel:"Tankstelle",
  charging_station:"Ladestation",hotel:"Hotel",hostel:"Hostel",motel:"Motel",guest_house:"Pension",parking:"Parkplatz",bank:"Bank",atm:"Geldautomat",post_office:"Post",police:"Polizei",
  fire_station:"Feuerwehr",museum:"Museum",cinema:"Kino",theatre:"Theater",castle:"Schloss",zoo:"Zoo",attraction:"Sehenswürdigkeit"};
const kindOf=p=>KIND[p.subclass]||KIND[p.class]||String(p.subclass||p.class||"").replace(/_/g," ");
map.on("click",e=>{
  if(nav)return;
  /* Tipp auf ein POI-Icon? Dann Ort mit Name/Webseite/Google-Maps-Buttons statt nacktem Punkt */
  const r=12,box=[[e.point.x-r,e.point.y-r],[e.point.x+r,e.point.y+r]];
  const ids=Object.keys(POI).map(g=>"poi_"+g).filter(id=>map.getLayer(id));
  const f=ids.length?map.queryRenderedFeatures(box,{layers:ids}).find(f=>f.properties.name_de||f.properties.name):null;
  if(f){
    const p=f.properties,c=f.geometry.type==="Point"?f.geometry.coordinates:[e.lngLat.lng,e.lngLat.lat];
    pick({name:p.name_de||p.name,lngLat:c,sub:kindOf(p),place:true},false);return;
  }
  pick({name:"Gewählter Punkt",lngLat:[e.lngLat.lng,e.lngLat.lat]},false);
});

const meEl=document.createElement("div");meEl.className="me";
/* Standort-Marker nach Vorlage: GTA V = weißer Pfeil mit schwarzem Rand, RDR2 = heller Tropfen mit Ring (Spitze zeigt in Fahrtrichtung) */
const ME={
 radar:'<svg viewBox="0 0 100 100"><polygon points="50,6 87,93 50,73 13,93" fill="#fff" stroke="#14181c" stroke-width="8" stroke-linejoin="round"/></svg>',
 parch:'<svg viewBox="0 0 100 100"><path d="M50 5C56 27 80 40 80 64a30 30 0 0 1-60 0C20 40 44 27 50 5z" fill="#eadcb8" stroke="#2a2824" stroke-width="8" stroke-linejoin="round"/><circle cx="50" cy="64" r="11" fill="#b9ad8f" stroke="#2a2824" stroke-width="7"/></svg>'};
const setMe=()=>{meEl.innerHTML=ME[STYLES[si][1]]};setMe();
const meMarker=new maplibregl.Marker({element:meEl,rotationAlignment:"map",pitchAlignment:"map"});

function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2200)}
$("styleBtn").onclick=()=>{
  si=(si+1)%STYLES.length;map.setStyle(styleOf(si),{diff:false});setMe();toast(STYLES[si][0]);
  if(destMarker){const ll=destMarker.getLngLat();destMarker.remove();destMarker=makeDest(ll)}
};
function makeDest(ll){return new maplibregl.Marker({color:STYLES[si][2]}).setLngLat(ll).addTo(map)}
$("locBtn").onclick=()=>{follow=true;if(me){map.easeTo({center:me,zoom:Math.max(map.getZoom(),15)})}};
$("stopBtn").onclick=stopNav;
let voice=true;try{voice=localStorage.getItem("voice")!=="0"}catch{}
$("voiceBtn").textContent=voice?"🔊":"🔇";
$("voiceBtn").onclick=()=>{
  voice=!voice;$("voiceBtn").textContent=voice?"🔊":"🔇";
  try{localStorage.setItem("voice",voice?"1":"0")}catch{}
  if(!voice)speechSynthesis.cancel();
  toast(voice?"Sprachansagen an":"Sprachansagen aus");
};

/* ---------- Standort ---------- */
navigator.geolocation.watchPosition(onPos,e=>toast("Standort: "+e.message),{enableHighAccuracy:true,maximumAge:1000});
function onPos(p){
  const c=p.coords;me=[c.longitude,c.latitude];
  if(c.heading!=null&&!isNaN(c.heading)&&c.speed>1)hdg=c.heading;
  meMarker.setLngLat(me).setRotation(hdg).addTo(map);
  if(first){first=false;map.jumpTo({center:me,zoom:15})}
  if(follow)camera();
  if(nav)navStep();
}
function camera(){
  if(!me)return;
  map.easeTo({center:me,bearing:nav?hdg:map.getBearing(),zoom:nav?16.5:map.getZoom(),
    pitch:nav?60:map.getPitch(),padding:{top:nav?260:0,bottom:0,left:0,right:0},duration:900});
}

/* ---------- Suche (Photon) ---------- */
let timer;$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(search,400)};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
async function search(){
  const s=$("q").value.trim(),box=$("results");box.innerHTML="";
  if(s.length<3)return;
  const u=new URL("https://photon.komoot.io/api/");
  u.search=new URLSearchParams({q:s,limit:6,lang:"de",...(me?{lat:me[1],lon:me[0]}:{})});
  try{
    const j=await(await fetch(u)).json();
    j.features.forEach(f=>{
      const p=f.properties,street=[p.street,p.housenumber].filter(Boolean).join(" ");
      const name=p.name||street;if(!name)return;
      const sub=[p.name?street:"",p.city,p.country].filter(Boolean).join(", ");
      const b=el("button","row");b.append(el("b",null,name),el("small",null,sub));
      const place=!!p.name&&!["highway","place","boundary","waterway"].includes(p.osm_key);
      const area=[[p.postcode,p.city||p.town||p.village||p.locality||p.district].filter(Boolean).join(" "),p.state,p.country].filter(Boolean).join(", ");
      b.onclick=()=>pick({name,lngLat:f.geometry.coordinates,sub,place,addr:p.name?street:"",area,osm:{t:p.osm_type,id:p.osm_id}},true);box.append(b);
    });
  }catch{toast("Suche nicht erreichbar")}
}
function pick(d,fly){
  dest=d;$("results").innerHTML="";$("q").value="";$("q").blur();follow=false;
  if(destMarker)destMarker.remove();
  destMarker=makeDest(d.lngLat);
  if(fly)map.flyTo({center:d.lngLat,zoom:15});
  if(d.place){enrich(d);locate(d)}
  renderPlace(d);
}
/* Karte für einen Ort: Route + (bei echten Orten) Webseite + Google Maps (Rezensionen) */
const ext=u=>window.open(u,"_blank","noopener");
/* Adresse + PLZ/Ort/Land: macht Namen eindeutig (z. B. Unterweisenbach DE vs. Unterweißenbach AT) */
const where=d=>[d.addr,d.area].filter(Boolean).join(", ");
function gmaps(d){
  const w=where(d);
  /* ohne jede Ortsangabe lieber die exakte Koordinate als einen Namen, der in einem anderen Land landen könnte */
  const q=w?d.name+", "+w:d.lngLat[1]+","+d.lngLat[0];
  return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
}
/* blockiert nie: ist die Webseite noch nicht gefunden, öffnet sich sofort die Google-Suche mit Ort */
function openWeb(d){
  if(d.web)return ext(d.web);
  ext("https://www.google.com/search?hl=de&q="+encodeURIComponent([d.name,where(d)].filter(Boolean).join(" ")));
}
/* Ort (PLZ, Ort, Land) für Treffer, die direkt von der Karte kommen, per Reverse-Geocoding */
async function locate(d){
  if(d.area)return;
  const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);
  try{
    const [lon,lat]=d.lngLat;
    const j=await(await fetch("https://photon.komoot.io/reverse?"+new URLSearchParams({lon,lat,lang:"de",limit:1}),{signal:c.signal})).json();
    const p=j.features&&j.features[0]&&j.features[0].properties;
    if(p)d.area=[[p.postcode,p.city||p.town||p.village||p.locality||p.district||p.county].filter(Boolean).join(" "),p.state,p.country].filter(Boolean).join(", ");
  }catch{}finally{clearTimeout(t)}
}
function renderPlace(d){
  const b=[["Route",planRoute,1]];
  if(d.place){
    b.push([d.web?"🌐 Webseite":"🔎 Web-Suche",()=>openWeb(d)]);
    b.push(["⭐ Google Maps",()=>ext(gmaps(d))]);
    b.push(["✕",cancel]);
  }else b.push(["Schließen",cancel]);
  showCard(d.name,d.sub||"",b);
}
/* Webseite/Adresse kommt aus OpenStreetMap-Tags (Overpass); die Kartenkacheln enthalten sie nicht */
const OVP=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
async function overpass(q){
  const ctrls=[];
  const one=async u=>{
    const c=new AbortController();ctrls.push(c);const t=setTimeout(()=>c.abort(),7000);
    try{const r=await fetch(u+"?data="+encodeURIComponent(q),{signal:c.signal});if(!r.ok)throw new Error(r.status);return(await r.json()).elements}
    finally{clearTimeout(t)}
  };
  try{const r=await Promise.any(OVP.map(one));ctrls.forEach(c=>c.abort());return r}catch{return null}
}
async function enrich(d){
  d.looking=true;
  try{
    const [lon,lat]=d.lngLat,ty={N:"node",W:"way",R:"relation"}[d.osm&&d.osm.t],id=d.osm&&d.osm.id;
    const els=await overpass(`[out:json][timeout:6];(${ty&&id?`${ty}(${id});`:""}nwr(around:50,${lat},${lon})["name"];);out tags center 80;`);
    if(els){
      const n=d.name.toLowerCase(),same=x=>["name","name:de","brand","official_name"].some(k=>x[k]&&x[k].toLowerCase()===n);
      const hasW=x=>x&&(x.website||x["contact:website"]||x.url||x["contact:url"]);
      const own=ty&&id?(els.find(e=>e.type===ty&&e.id===id)||{}).tags:null;
      const all=els.map(e=>e.tags||{});
      const t=hasW(own)?own:(all.find(x=>same(x)&&hasW(x))||own||all.find(same));
      if(t){
        const w=t.website||t["contact:website"]||t.url||t["contact:url"];
        if(w)d.web=/^https?:\/\//i.test(w)?w:"https://"+w;
        const a=[[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" "),t["addr:city"]].filter(Boolean).join(", ");
        if(a){d.addr=a;if(!d.osm)d.sub=[d.sub,a].filter(Boolean).join(" · ")}
      }
    }
  }catch{}
  d.looking=false;
  if(dest===d&&!d.routed)renderPlace(d);
}
function showCard(t,s,btns){
  $("cTitle").textContent=t;$("cSub").textContent=s;const b=$("cBtns");b.innerHTML="";
  btns.forEach(([l,fn,p])=>{const x=el("button","btn"+(p?" p":""),l);x.onclick=fn;b.append(x)});
  $("card").style.display="block";
}
function cancel(){
  $("card").style.display="none";dest=null;routeGeo=null;
  if(destMarker){destMarker.remove();destMarker=null}
  map.getSource("route")?.setData({type:"FeatureCollection",features:[]});
}

/* ---------- Routing (Valhalla) ---------- */
function decode(str){let i=0,lat=0,lon=0,out=[];
  while(i<str.length){let b,s=0,r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);
    s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lon+=(r&1)?~(r>>1):(r>>1);
    out.push([lon/1e6,lat/1e6])}
  return out}
const rad=Math.PI/180;
function dist(a,b){const dLa=(b[1]-a[1])*rad,dLo=(b[0]-a[0])*rad;
  const h=Math.sin(dLa/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dLo/2)**2;
  return 12742000*Math.asin(Math.sqrt(h))}
async function fetchRoute(){
  const body={locations:[{lat:me[1],lon:me[0]},{lat:dest.lngLat[1],lon:dest.lngLat[0]}],costing:"auto",
    directions_options:{language:"de-DE",units:"kilometers"}};
  const j=await(await fetch(VALHALLA+"?json="+encodeURIComponent(JSON.stringify(body)))).json();
  const leg=j.trip.legs[0];
  shape=decode(leg.shape);man=leg.maneuvers;tripTime=j.trip.summary.time;
  cum=[0];for(let i=1;i<shape.length;i++)cum[i]=cum[i-1]+dist(shape[i-1],shape[i]);
  routeGeo={type:"Feature",geometry:{type:"LineString",coordinates:shape}};
  map.getSource("route")?.setData(routeGeo);
  lastIdx=0;spoke={};
  return j.trip.summary;
}
async function planRoute(){
  if(!me){toast("Warte auf GPS …");return}
  try{
    const s=await fetchRoute();
    const b=shape.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(shape[0],shape[0]));
    map.fitBounds(b,{padding:{top:80,bottom:260,left:40,right:40}});
    dest.routed=true;
    showCard(`${s.length.toFixed(1)} km · ${Math.round(s.time/60)} min`,dest.name,[["Los",startNav,1],["Abbrechen",cancel]]);
  }catch{toast("Routing nicht erreichbar")}
}
/* Routenlinie nach Vorlage: GTA V = lila, leicht durchsichtig, dünner dunkler Rand; RDR2 = schmale rote Linie mit dunklem Rand */
const ROUTE={
 radar:{col:"#a34cf1",op:.72,w:7,cc:"#0d0614",co:.5,cw:10.5},
 parch:{col:"#b3261e",op:1,w:4.5,cc:"#2a1a12",co:.85,cw:7.5}};
const rw=w=>["interpolate",["linear"],["zoom"],9,w*.45,15,w,19,w*1.7];
function addRoute(){
  if(map.getSource("route"))return;
  const R=ROUTE[STYLES[si][1]];
  map.addSource("route",{type:"geojson",data:routeGeo||{type:"FeatureCollection",features:[]}});
  const lay={"line-cap":"round","line-join":"round"};
  map.addLayer({id:"route-casing",type:"line",source:"route",layout:lay,paint:{"line-color":R.cc,"line-opacity":R.co,"line-width":rw(R.cw)}});
  map.addLayer({id:"route-line",type:"line",source:"route",layout:lay,paint:{"line-color":R.col,"line-opacity":R.op,"line-width":rw(R.w)}});
}

/* ---------- Navigation ---------- */
const ICON={9:"↗",10:"➡",11:"↘",12:"↩",13:"↩",14:"↙",15:"⬅",16:"↖",4:"🏁",5:"🏁",6:"🏁",26:"⟳",27:"⟳"};
const fmt=d=>d<1000?Math.max(10,Math.round(d/10)*10)+" m":(d/1000).toFixed(1)+" km";
function speak(t){if(!voice||!t||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";speechSynthesis.cancel();speechSynthesis.speak(u)}
async function wake(){try{wakeLock=await navigator.wakeLock.request("screen")}catch{}}
document.addEventListener("visibilitychange",()=>{if(nav&&document.visibilityState==="visible")wake()});
function startNav(){
  nav=true;follow=true;document.body.classList.add("nav");$("card").style.display="none";
  speak("Navigation gestartet");wake();camera();
}
function stopNav(){
  nav=false;document.body.classList.remove("nav");wakeLock?.release();speechSynthesis.cancel();cancel();
  map.easeTo({pitch:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0}});
}
async function navStep(){
  let bi=lastIdx,bd=1e12;
  for(let i=Math.max(0,lastIdx-5);i<shape.length;i++){const d=dist(me,shape[i]);if(d<bd){bd=d;bi=i}}
  if(bd>70){
    if(Date.now()-lastReroute>10000){lastReroute=Date.now();speak("Route wird neu berechnet");try{await fetchRoute()}catch{}}
    return;
  }
  lastIdx=bi;
  const rem=cum[cum.length-1]-cum[bi];
  if(rem<25){speak("Sie haben Ihr Ziel erreicht");stopNav();return}
  const k=man.findIndex((m,i)=>i>0&&m.begin_shape_index>bi);
  if(k<0)return;
  const m=man[k],d=cum[m.begin_shape_index]-cum[bi];
  $("bDist").textContent=(ICON[m.type]||"⬆")+" "+fmt(d);
  $("bText").textContent=m.instruction;
  $("rem").textContent=fmt(rem);
  $("eta").textContent=new Date(Date.now()+tripTime*1000*(rem/cum[cum.length-1])).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr";
  const st=spoke[k]||0;
  if(d<=80&&st<2){spoke[k]=2;speak(m.instruction)}
  else if(d<=450&&st<1){spoke[k]=1;speak("In "+Math.round(d/50)*50+" Metern: "+m.instruction)}
}
